# Catches the manifest mistakes that would otherwise only surface as a failed
# install inside DraconDex. No dependencies to install — the validator is plain
# Node, and `node --check` just parses the plugin's own scripts.
name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate manifest
        run: node scripts/validate-manifest.mjs
      # Every script the manifest ships, not just the entry — a parse error in
      # any of them is a plugin that installs fine and then does nothing.
      - name: Parse plugin scripts
        run: |
          for f in app.js panel.js src/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      # Drives src/provider.js against canned SSE — the Messages-API event
      # mapping and the OAuth connection gate are the part a manifest check
      # can't see.
      - name: Run tests
        run: node --test test/*.test.mjs
